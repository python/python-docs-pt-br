name: python-314

on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *'
  pull_request:
    branches:
      - main
      - '3.14'
  push:
    branches:
      - main
      - '3.14'

jobs:
  sync:
    uses: ./.github/workflows/sync.yml
    permissions:
      contents: write
    with:
      tx_project: python-314
      version: 3.14
    secrets:
      tx_token: ${{ secrets.TX_TOKEN }}
  check:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read
    needs: sync
    with:
      tx_project: python-314
      version: 3.14
    secrets:
      telegram_token: ${{ secrets.TELEGRAM_TOKEN }}
      telegram_to: ${{ secrets.TELEGRAM_TO }}
