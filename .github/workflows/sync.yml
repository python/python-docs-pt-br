name: Sync

on:
  workflow_call:
    inputs:
      version:
        description: "Branch name corresponding to a Python version"
        required: true
        type: string
      tx_project:
        description: "Name of the Transifex translation project"
        required: true
        type: string
    secrets:
      tx_token:
        description: "Token required for interacting with Transifex API"
        required: false

env:
  PYDOC_LANGUAGE: pt_BR
  PYDOC_TX_PROJECT: ${{ inputs.tx_project }}
  PYDOC_VERSION: ${{ inputs.version }}
  PYDOC_LANG_DIR: ${{ inputs.version }}
  TX_CLI_VERSION: '1.6.17'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:

      # 1- Set up environment

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout this repository ${{ env.PYDOC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PYDOC_VERSION }}
          path: ${{ env.PYDOC_LANG_DIR }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.version }}
          allow-prereleases: true
          cache: 'pip'

      # 2- Install dependencies

      - name: Install Transifex CLI tool
        run: |
          cd /usr/local/bin
          curl -o- https://raw.githubusercontent.com/transifex/cli/master/install.sh | bash -s -- v${TX_CLI_VERSION}

      - name: Install Python packages
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      - name: Install APT dependencies
        run: sudo apt update -y && sudo apt install gettext -y

      # 3- Pull translations

      - name: Generate updated .tx/config
        if: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
        run: python scripts/generate_txconfig.py -p ./${PYDOC_LANG_DIR} ${PYDOC_TX_PROJECT}
        env:
          TX_TOKEN: ${{ secrets.tx_token }}

      - name: Pull translations from Transifex
        id: pull
        if: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
        run: |
          # Clean up obsolete files
          find ./${PYDOC_LANG_DIR} -name '*.po' -exec rm {} \;
          ./scripts/pull_translations.sh
        env:
          TX_TOKEN: ${{ secrets.tx_token }}

      - name: Merge translations from newer branch
        if: inputs.tx_project != 'python-newest' # python-newest doesn't have a newer branch
        run: |
          newer_branch=${PYDOC_VERSION%%.*}.$((${PYDOC_VERSION##*.}+1))
          git clone --depth 1 --single-branch --branch $newer_branch https://github.com/python/python-docs-pt-br ${newer_branch}-dir
          pomerge --from ./${newer_branch}-dir/{**/,}*.po --to ./${PYDOC_LANG_DIR}/{**/,}*.po
          rm -rf ./${newer_branch}-dir

      - name: powrap
        if: steps.pull.outcome == 'success'
        run: |
          cd ./${PYDOC_LANG_DIR}
          powrap *.po **/*.po

      - name: Update statistics
        if: always()
        run: |
          ./scripts/stats.py
          git -C ./${PYDOC_LANG_DIR} diff stats.json
        env:
          PYDOC_LANG_DIR: ${{ env.PYDOC_LANG_DIR }}

      - name: Update potodo.md
        if: always()
        run: |
          ./scripts/potodo.sh
          git -C ./${PYDOC_LANG_DIR} diff potodo.md
        env:
          PYDOC_LANG_DIR: ${{ env.PYDOC_LANG_DIR }}

      - name: Upload translation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-${{ env.PYDOC_VERSION }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ env.PYDOC_LANG_DIR }}/.tx/config
            ${{ env.PYDOC_LANG_DIR }}/potodo.md
            ${{ env.PYDOC_LANG_DIR }}/stats.json
            ${{ env.PYDOC_LANG_DIR }}/*.po
            ${{ env.PYDOC_LANG_DIR }}/**/*.po

  commit:
    runs-on: ubuntu-latest
    needs: sync
    permissions:
      contents: write
    steps:

      # 1- Set up environment

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout this repository ${{ env.PYDOC_VERSION }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PYDOC_VERSION }}
          path: ${{ env.PYDOC_LANG_DIR }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.version }}
          allow-prereleases: true
          cache: 'pip'

      - name: Install Python packages
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt

      # 2- Remove PO files and the download files (excluding obsolete)

      - name: Clean PO files
        run: find ${PYDOC_LANG_DIR} -name '*.po' | xargs -r rm

      - name: Download translation artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-${{ env.PYDOC_VERSION }}
          path: ${{ env.PYDOC_LANG_DIR }}

      # 3- Commit and push changed files depending on the event name

      - name: Commit
        run: ./scripts/commit.sh
        env:
          PYDOC_LANG_DIR: ${{ env.PYDOC_LANG_DIR }}

      - name: Push
        if: ${{ contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ./${PYDOC_LANG_DIR}
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push
